<style>
  /* ================= ENTRANCE (plays once) ================= */
  @keyframes sigCardIn   { from{ opacity:0; transform:translateY(16px) scale(.99); } to{ opacity:1; transform:none; } }
  @keyframes sigRise     { from{ opacity:0; transform:translateY(10px); }            to{ opacity:1; transform:none; } }
  @keyframes sigRailIn   { from{ opacity:0; transform:translateX(-10px); }           to{ opacity:1; transform:none; } }
  @keyframes sigPhotoIn  { from{ opacity:0; transform:scale(1.05); }                 to{ opacity:1; transform:none; } }

  /* ================= IDLE (subtle, professional loop) ================= */
  @keyframes sigFloat    { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }
  @keyframes sigSheen    { 0%{ transform:translateX(-140%) skewX(-18deg); } 100%{ transform:translateX(360%) skewX(-18deg); } }
  @keyframes sigHair     { 0%,100%{ opacity:.35; } 50%{ opacity:.9; } }

  .sig-card{ animation: sigCardIn .7s cubic-bezier(.16,1,.3,1) both; }
  .sig-rail-item{ opacity:0; }
  .sig-r1{ animation: sigRailIn .5s ease-out .25s both; }
  .sig-r2{ animation: sigRailIn .5s ease-out .35s both; }
  .sig-r3{ animation: sigRailIn .5s ease-out .45s both; }
  .sig-name{ animation: sigRise .6s ease-out .30s both; }
  .sig-line1{ animation: sigRise .6s ease-out .42s both; }
  .sig-line2{ animation: sigRise .6s ease-out .50s both; }
  .sig-hairline{ animation: sigRise .6s ease-out .38s both, sigHair 6s ease-in-out 1.2s infinite; }

  .sig-photo-wrap{ animation: sigPhotoIn .8s cubic-bezier(.16,1,.3,1) .15s both, sigFloat 7s ease-in-out 1.1s infinite; }
  .sig-sheen{ animation: sigSheen 7s ease-in-out 2s infinite; }

  .sig-rail-item a{ transition: color .2s ease, transform .2s ease; display:inline-block; }
  .sig-rail-item a:hover{ color:#2563eb; transform:translateY(-2px) scale(1.12); }
  .sig-photo{ transition: transform .5s ease; }
  .sig-photo-wrap:hover .sig-photo{ transform:scale(1.04); }

  @media (prefers-reduced-motion: reduce){
    .sig-card,.sig-rail-item,.sig-name,.sig-line1,.sig-line2,.sig-hairline,.sig-photo-wrap,.sig-sheen{ animation:none !important; opacity:1 !important; }
  }
</style>
