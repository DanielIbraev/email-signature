<style>
  /* ===== Looped animations — play in Apple Mail, Outlook (Mac) & browsers.
     Gmail strips <style>, so it falls back to the clean static card. ===== */

  .sig-card{ animation: sigFloat 5s ease-in-out infinite; }
  @keyframes sigFloat{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-4px);} }

  /* moving light sweep across the card */
  .sig-card{ position:relative; overflow:hidden; }
  .sig-sweep{
    position:absolute; top:0; left:-60%; width:45%; height:100%;
    background:linear-gradient(115deg,transparent,rgba(34,211,238,.18),transparent);
    transform:skewX(-18deg); animation: sigSweep 4.5s ease-in-out infinite; pointer-events:none;
  }
  @keyframes sigSweep{ 0%{ left:-60%; } 55%,100%{ left:130%; } }

  /* rotating conic gradient ring behind the photo */
  .sig-ring{ animation: sigSpin 5s linear infinite; }
  @keyframes sigSpin{ to{ transform:rotate(360deg); } }

  /* shimmering name */
  .sig-name{
    background-image:linear-gradient(90deg,#0f172a,#0d9488,#22d3ee,#0d9488,#0f172a);
    background-size:200% auto; -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; animation: sigShimmer 5s linear infinite;
  }
  @keyframes sigShimmer{ to{ background-position:200% center; } }

  /* floating + glowing social icons (staggered) */
  .sig-icon{ transition: transform .25s ease, box-shadow .25s ease, background .25s ease; }
  .sig-i1{ animation: sigBob 3s ease-in-out infinite 0s;   }
  .sig-i2{ animation: sigBob 3s ease-in-out infinite .35s; }
  .sig-i3{ animation: sigBob 3s ease-in-out infinite .7s;  }
  @keyframes sigBob{
    0%,100%{ transform:translateY(0);   box-shadow:0 2px 6px rgba(15,23,42,.06); }
    50%    { transform:translateY(-5px);box-shadow:0 10px 18px rgba(13,148,136,.28); }
  }
  .sig-icon:hover{
    transform:translateY(-6px) scale(1.12) !important;
    background:#0d9488 !important; box-shadow:0 12px 22px rgba(13,148,136,.45) !important;
  }
  .sig-icon:hover .sig-icon-svg{ filter:brightness(0) invert(1); }

  .sig-photo{ transition: transform .35s ease; }
  .sig-photo:hover{ transform:scale(1.05); }

  @media (prefers-reduced-motion: reduce){
    .sig-card,.sig-ring,.sig-name,.sig-i1,.sig-i2,.sig-i3,.sig-sweep{ animation:none !important; }
  }
</style>
